<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>tr('XENEON Edge Navigation Deck')</title>
  <link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
<main>
 <nav aria-label="Global navigation">
  <button id="home" type="button"><img src="assets/lucide/house.svg" alt="" aria-hidden="true"><span>HOME</span></button>
  <button id="back" type="button"><img src="assets/lucide/arrow-left.svg" alt="" aria-hidden="true"><span>BACK</span></button>
  <div class="context"><h1 id="location" tabindex="-1">HOME</h1><div id="page"></div></div>
  <button id="prev" type="button" aria-label="Previous page"><img src="assets/lucide/chevron-left.svg" alt="" aria-hidden="true"><span>PREV</span></button>
  <button id="next" type="button" aria-label="Next page"><img src="assets/lucide/chevron-right.svg" alt="" aria-hidden="true"><span>NEXT</span></button>
 </nav>
 <section id="cards" aria-label="Deck destinations"></section>
 <footer><span id="feedback" role="status" aria-live="polite">Navigation prototype</span><span>LOCAL ONLY / NO APP BINDINGS</span></footer>
</main>
  <script src="scripts/main.js"></script>
  <script>
    // No subscriptions or app bindings. Host callbacks must not reset navigation.
    window.icueEvents = {
      onICUEInitialized: function() {},
      onDataUpdated: function() {}
    };
  </script>
</body>
</html>
